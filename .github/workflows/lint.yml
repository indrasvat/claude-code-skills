name: Lint

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        # actions/checkout v5.0.1 — pinned to a SHA so a flaky mutable-tag
        # fetch can't silently break CI (we hit one on 2026-05-23 post-merge)
        # and so unreviewed action changes can't land via @v4/@master.
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      # Use the same `make lint` target developers run locally so CI and local
      # checks never diverge (single source of truth in the Makefile). shellcheck
      # is preinstalled on ubuntu-latest; `make lint` lints tracked shell scripts
      # via `git ls-files` at severity=warning and fails loudly if it's missing.
      - name: Run make lint
        run: make lint

  validate-skills:
    name: Validate Skills
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      # Parse each SKILL.md frontmatter with js-yaml (the engine skills.sh uses)
      # and cross-check discovery with the real `skills` CLI. Logic lives in the
      # script so it's runnable locally via `make validate-skills`. Node ships on
      # ubuntu-latest; the script installs js-yaml on demand.
      - name: Validate skills
        run: make validate-skills

  test-browsing:
    name: Test browsing-as-you
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      # Offline, stdlib-only tests for the gh-attach upload helper (issue #18):
      # pure URL/extraction logic + the structural guarantee that the upload path
      # clicks nothing. No browser, no uv, no deps — python3 ships on ubuntu.
      - name: Run make test-browsing
        run: make test-browsing

  test-pr-evidence:
    name: Test pr-evidence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      # The skill's scripts against real tools: ffmpeg for the phone-playback
      # gate and composition, uv for the Pillow scripts, shux for recording.
      # uv and shux are pinned; the shux installer verifies its checksum.
      - name: Install ffmpeg, fonts, uv and shux
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fontconfig fonts-dejavu-core
          curl -LsSf https://astral.sh/uv/0.13.9/install.sh | sh
          curl -sSfL https://shux.pages.dev/install.sh | sh -s -- --version v0.57.2 --no-skill
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run make test-pr-evidence
        run: make test-pr-evidence
